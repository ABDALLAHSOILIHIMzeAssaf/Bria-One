<!DOCTYPE html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Utilisateurs | Bria’One</title><link rel="stylesheet" href="/css/briaone.css"></head><body><header th:replace="~{fragments/header :: header}"></header><div class="app-shell"><aside th:replace="~{fragments/navbar :: navbar}"></aside><main class="main-panel"><div class="page-heading"><h1>Utilisateurs</h1><button class="teal-button" onclick="openModal('addUserModal')">+ Utilisateur</button></div><div class="user-list"><div class="user-row user-header"><span>ID</span><span>Nom</span><span>E-mail</span><span>Mot de passe</span><span>Rôle</span><span></span><span></span></div><div class="user-row" th:each="utilisateur : ${utilisateurs}"><span th:text="${utilisateur.id}">456</span><span th:text="${utilisateur.nom}">Mzé ABDALLAH</span><span th:text="${utilisateur.email}">email@monlycee.net</span><span>******</span><span th:text="${utilisateur.role}">Étudiant</span><button class="blue-button" th:attr="data-id=${utilisateur.id},data-name=${utilisateur.nom},data-email=${utilisateur.email},data-role=${utilisateur.role}" onclick="editUserFromButton(this)">Modifier</button><form th:action="@{/admin/utilisateurs/supprimer/{id}(id=${utilisateur.id})}" method="post"><button class="pink-button" type="submit">Supprimer</button></form></div><div class="user-row demo-row" th:if="${utilisateurs == null or #lists.isEmpty(utilisateurs)}"><span>456</span><span>Mzé ABDALLAH</span><span>mze.abdallahsolihi@monlycee.net</span><span>******</span><span>Étudiant</span><button class="blue-button" onclick="openModal('editUserModal')">Modifier</button><button class="pink-button">Supprimer</button></div></div>
  <div class="modal-overlay" id="addUserModal"><form class="model-modal teal-modal" th:action="@{/admin/utilisateurs/ajouter}" action="/admin/utilisateurs/ajouter" method="post"><h2>Ajouter un utilisateur</h2><input name="nom" placeholder="Nom et prénom ..." required><input name="email" type="email" placeholder="Adresse e-mail ..." required><input name="identifiant" placeholder="Identifiant ..." required><input name="password" type="password" placeholder="Mot de passe ..." required><select name="role"><option>Étudiant</option><option>Professeur</option><option>Administrateur</option></select><div class="modal-footer"><button type="button" class="text-close" onclick="closeModal('addUserModal')">Annuler</button><button class="gradient-button" type="submit">Ajouter</button></div></form></div>
  <div class="modal-overlay" id="editUserModal"><form class="model-modal blue-modal" th:action="@{/admin/utilisateurs/modifier}" action="/admin/utilisateurs/modifier" method="post"><h2>Modifier un utilisateur</h2><input name="id" id="editUserId" placeholder="Identifiant"><input name="nom" id="editUserName" placeholder="Nom et prénom"><input name="email" id="editUserEmail" type="email" placeholder="Adresse e-mail"><select name="role" id="editUserRole"><option>Étudiant</option><option>Professeur</option><option>Administrateur</option></select><div class="modal-footer"><button type="button" class="text-close" onclick="closeModal('editUserModal')">Annuler</button><button class="gradient-button" type="submit">Enregistrer</button></div></form></div>
</main></div><script src="/js/briaone.js"></script></body></html>
