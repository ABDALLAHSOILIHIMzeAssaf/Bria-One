<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accueil | Bria’One</title>
  <link rel="stylesheet" href="/css/briaone.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons-1.13.2/font/bootstrap-icons.css">
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<div class="app-shell">
  <aside th:replace="~{fragments/navbar :: navbar}"></aside>
  <main class="main-panel chat-main">
    <section class="welcome-card"><h1>Bienvenue sur Bria’One !</h1>
      <p>Vous pouvez dès maintenant échanger avec différents modèles<br class="desktop"> d'intelligence
        artificielle, poser vos questions et obtenir de l'aide<br class="desktop"> sur de nombreux sujets.</p>
    </section>
    <form class="chat-composer" th:action="@{/chat/send}" action="/chat/send" method="post"
          enctype="multipart/form-data">
      <div class="model-choice"><label for="model">Modèle</label><select id="model" name="modele">
        <option th:each="modele : ${modeles}" th:value="${modele.id}" th:text="${modele.nom}">Claude</option>
        <option th:if="${modeles == null or #lists.isEmpty(modeles)}">Claude</option>
        <option th:if="${modeles == null or #lists.isEmpty(modeles)}">Mistral</option>
        <option th:if="${modeles == null or #lists.isEmpty(modeles)}">Gemini</option>
      </select></div>
      <label class="attach-btn" title="Ajouter une pièce jointe"><ion-icon name="download-outline"></ion-icon><input type="file"
                                                                                                     name="fichier"
                                                                                                     hidden>
      </label>
      <textarea name="message" placeholder="Saisir votre message ......">
      </textarea>
      <button class="send-btn" type="submit" aria-label="Envoyer"><ion-icon name="arrow-forward-outline"></ion-icon></button>
    </form>
  </main>
</div>
<script src="/js/briaone.js"></script>
<script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>
</html>
