<!DOCTYPE html>
<html lang="fr" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil | Bria’One</title>
  <link rel="stylesheet" th:href="@{/css/briaone.css}" href="/css/briaone.css">
  <link rel="icon" type="image/png" th:href="@{/img/BriaOne_logo.png}" href="/img/BriaOne_logo.png">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons-1.13.2/font/bootstrap-icons.css}" href="/vendor/bootstrap-icons-1.13.2/font/bootstrap-icons.css">
</head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<div class="app-shell">
  <aside th:replace="~{fragments/navbar :: navbar}"></aside>

  <main class="main-panel chat-main">

    <!-- 1. Écran d'accueil : affiché uniquement si aucune conversation n'est sélectionnée -->
    <section class="welcome-card" th:if="${conversation == null}">
      <h1>Bienvenue sur Bria’One !</h1>
      <p>Vous pouvez dès maintenant échanger avec différents modèles<br class="desktop"> d'intelligence
        artificielle, poser vos questions et obtenir de l'aide<br class="desktop"> sur de nombreux sujets.</p>
    </section>

    <!-- 2. Zone des messages : affichée lorsqu'une conversation existe -->
    <section class="chat-messages flex-grow-1 overflow-auto p-4" th:if="${conversation != null}">
      <div th:each="message : ${messages}" class="mb-4">
        <strong th:text="${message.typeMessage}">UTILISATEUR</strong>
        <div class="message mt-2 message-content" th:text="${message.contenu}">
          Contenu du message
        </div>
      </div>
    </section>

    <!-- 3. Zone de saisie -->
    <div class="border-top p-3">

      <!-- Création d'une conversation (conversation == null) -->
      <form id="formChat"
            class="chat-composer"
            th:if="${conversation == null}"
            th:action="@{/conversations}"
            method="post"
            enctype="multipart/form-data">

        <div class="model-choice model-select-wrapper">
          <label for="model">Modèle</label>
          <select id="model" name="idModele" class="form-select model-select" required>
            <option value="" disabled selected>Choisir un modèle IA</option>
            <option th:each="modele : ${modeles}"
                    th:value="${modele.id}"
                    th:text="${modele.nom}">
              Mistral
            </option>
            <option th:if="${modeles == null or #lists.isEmpty(modeles)}" value="" disabled>
              Aucun modèle disponible
            </option>
          </select>
        </div>

        <label class="attach-btn" title="Ajouter une pièce jointe">
          <ion-icon name="download-outline"></ion-icon>
          <input type="file" name="fichier" hidden>
        </label>

        <textarea name="prompt" class="form-control" rows="2" placeholder="Posez votre question..." required></textarea>

        <button class="send-btn btn btn-primary" type="submit" aria-label="Envoyer">
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>
      </form>

      <!-- Conversation existante (conversation != null) -->
      <form class="chat-composer"
            th:if="${conversation != null}"
            th:action="@{/conversations/{id}/messages(id=${conversation.id})}"
            method="post"
            enctype="multipart/form-data">

        <div class="model-choice model-current d-flex align-items-center gap-2">
          <img th:if="${conversation.modeleIA != null and conversation.modeleIA.cheminLogo != null}"
               th:src="@{${conversation.modeleIA.cheminLogo}}"
               alt="Logo du modèle"
               width="28"
               height="28">
          <span th:text="${conversation.modeleIA != null ? conversation.modeleIA.nom : 'Modèle IA'}">
            Mistral
          </span>
        </div>

        <label class="attach-btn" title="Ajouter une pièce jointe">
          <ion-icon name="download-outline"></ion-icon>
          <input type="file" name="fichier" hidden>
        </label>

        <textarea name="prompt" class="form-control" rows="2" placeholder="Écrivez votre message..." required></textarea>

        <button class="send-btn btn btn-primary" type="submit" aria-label="Envoyer">
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </button>
      </form>

    </div>

  </main>
</div>

<script th:src="@{/js/briaone.js}" src="/js/briaone.js"></script>
<script type="module" src="https://unpkg.com"></script>
<script nomodule src="https://unpkg.com"></script>
</body>
</html>
